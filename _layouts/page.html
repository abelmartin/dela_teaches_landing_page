---
layout: default
---

<div class="container">
  {% if page.show_header != false %}
    <div class="section-header" style="margin-bottom: 2.5rem;">
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}
        <p class="section-subtitle">{{ page.subtitle }}</p>
      {% endif %}
    </div>
  {% endif %}

  {{ content }}
</div>
